name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install backend dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "backend[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check backend/ tests/backend/

      - name: Formatting check
        run: .venv/bin/ruff format --check backend/ tests/backend/

      - name: Run tests
        run: .venv/bin/pytest tests/backend/ --cov=backend/app --cov-report=term-missing:skip-covered --cov-fail-under=55 -q

  migration-safety:
    name: Migration Safety Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check migrations for unreviewed destructive operations
        run: bash scripts/check-migrations.sh backend/app/db/migrations/versions

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP_DB_PASSWORD: ci-app-password
      BACKUP_LOCAL_PATH: /tmp/wished-backups
      CADDY_DOMAIN: example.com
      JWT_SECRET_KEY: ci-jwt-secret
      MINIO_ACCESS_KEY: ci-minio-access-key
      MINIO_SECRET_KEY: ci-minio-secret-key
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: wished_ci_bot
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      TELEGRAM_BOT_TOKEN: 0000000000:ci-token
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate production compose config
        run: docker compose -f docker/docker-compose.prod.yml config --quiet

      - name: Build production images
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          files: docker/docker-compose.prod.yml
          targets: |
            frontend
            backend
            backup
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            frontend.tags=ghcr.io/${{ github.repository_owner }}/wished-frontend:latest
            backend.tags=ghcr.io/${{ github.repository_owner }}/wished-backend:latest
            backup.tags=ghcr.io/${{ github.repository_owner }}/wished-backup:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint-and-test, migration-safety, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: REGISTRY_TOKEN,GITHUB_ACTOR
          script: |
            # without this a failed git pull still runs deploy.sh on whatever is on disk
            set -eu
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            cd ${{ secrets.SSH_PATH }}
            git stash push --include-untracked -m "pre-deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git pull --ff-only
            bash deploy/deploy.sh
        env:
          # the job's own token: it expires with the run, and it can pull what
          # docker-build pushed with the same token
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

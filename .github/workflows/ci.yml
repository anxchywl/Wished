name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install backend dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "backend[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check backend/

      - name: Run tests
        run: .venv/bin/pytest backend/tests/ -v

  migration-safety:
    name: Migration Safety Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check migrations for unreviewed destructive operations
        run: bash scripts/check-migrations.sh backend/app/db/migrations/versions

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    env:
      APP_DB_PASSWORD: ci-app-password
      BACKUP_LOCAL_PATH: /tmp/wished-backups
      CADDY_DOMAIN: example.com
      JWT_SECRET_KEY: ci-jwt-secret
      MINIO_ACCESS_KEY: ci-minio-access-key
      MINIO_SECRET_KEY: ci-minio-secret-key
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: wished_ci_bot
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      TELEGRAM_BOT_TOKEN: 0000000000:ci-token

    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose config
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build frontend backend bot backup

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint-and-test, migration-safety, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SSH_PATH }}
            git stash push --include-untracked -m "pre-deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git pull --ff-only
            bash scripts/deploy.sh

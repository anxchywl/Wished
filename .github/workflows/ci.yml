name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e "backend[dev]"

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Run tests
        # test_marketplace.py tests app.modules.marketplace.parsers which is not yet implemented
        run: pytest backend/tests/ -v --ignore=backend/tests/test_marketplace.py

  migration-safety:
    name: Migration Safety Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check migrations for unreviewed destructive operations
        run: bash scripts/check-migrations.sh backend/app/db/migrations/versions

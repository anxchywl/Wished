[project]
name = "wished-backend"
version = "0.1.0"
description = "Wished FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.1",
  "minio>=7.2.10",
  "PyJWT>=2.9.0",
  "pydantic-settings>=2.5.2",
  "python-multipart>=0.0.12",
  "redis>=5.0.8",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.30.6",
  "aiogram>=3.0.0",
  "httpx>=0.27.2",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Selected explicitly rather than left to ruff's defaults. Those defaults grew
# between 0.6 and 0.16, and because the dependency was unpinned CI adopted the
# larger set on its next install: 240 findings appeared with no code change and
# the pipeline had been red since 31 July. The rules below are the set this
# project has always been checked against; widening it is a decision to take
# deliberately, not one to inherit from a release.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests/backend"]

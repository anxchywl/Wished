name: wished

services:
  frontend:
    image: ghcr.io/${REGISTRY_OWNER:-anxchywl}/wished-frontend:latest
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
        NEXT_PUBLIC_TELEGRAM_MOCK: "0"
    container_name: wished-frontend
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    networks:
      - wished-app

  backend:
    image: ghcr.io/${REGISTRY_OWNER:-anxchywl}/wished-backend:latest
    build:
      context: ..
      dockerfile: docker/backend.production.Dockerfile
    container_name: wished-backend
    environment:
      APP_ENV: production
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      APP_NAME: ${APP_NAME:-Wished API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-}
      PUBLIC_WEB_APP_URL: ${PUBLIC_WEB_APP_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-300}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-wished}
      POSTGRES_USER: ${APP_DB_USER:-wished_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-wished_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-wished}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${REDIS_DB:-0}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: https://${CADDY_DOMAIN:?CADDY_DOMAIN must be set}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_SECURE: "false"
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-wished-media}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      TRUST_PROXY_HEADERS: "true"
      MARKETPLACE_PROXY_URL: ${MARKETPLACE_PROXY_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 512
    networks:
      - wished-app
      - wished-data

  caddy:
    image: caddy:2-alpine
    container_name: wished-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../infra/caddy/Caddyfile.production:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256
    networks:
      - wished-app
      - wished-data

  postgres:
    image: postgres:16
    container_name: wished-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wished}
      POSTGRES_USER: ${POSTGRES_USER:-wished}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wished} -d ${POSTGRES_DB:-wished}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512
    networks:
      - wished-data

  redis:
    image: redis:7-alpine
    container_name: wished-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 256
    networks:
      - wished-data

  minio:
    # docker hub no longer hosts minio images
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: wished-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 256
    networks:
      - wished-data

  bot:
    image: ghcr.io/${REGISTRY_OWNER:-anxchywl}/wished-backend:latest
    container_name: wished-bot
    command: python -m app.workers.bot
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-Wished Bot}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-}
      PUBLIC_WEB_APP_URL: ${PUBLIC_WEB_APP_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-wished}
      POSTGRES_USER: ${APP_DB_USER:-wished_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-wished_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-wished}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${REDIS_DB:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    networks:
      - wished-app
      - wished-data

  # Backup service — runs pg_dump + mc mirror every BACKUP_INTERVAL_SECONDS.
  # Backups land on the HOST at BACKUP_LOCAL_PATH (default /var/backups/wished)
  # so that `docker compose down -v` cannot destroy them.
  # Configure BACKUP_EXTERNAL_ENABLED=true + S3 credentials for off-server copies.
  backup:
    image: ghcr.io/${REGISTRY_OWNER:-anxchywl}/wished-backup:latest
    build:
      context: ..
      dockerfile: docker/backup.Dockerfile
    container_name: wished-backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-wished}
      POSTGRES_USER: ${POSTGRES_USER:-wished}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-wished-media}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-79200}
      BACKUP_EXTERNAL_ENABLED: ${BACKUP_EXTERNAL_ENABLED:-false}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-wished-backups}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    volumes:
      # host-bind-mount survives `docker compose down -v` and `docker volume rm`
      - ${BACKUP_LOCAL_PATH:-/var/backups/wished}:/backups
    healthcheck:
      # verify-backup exits non-zero if no backup exists or latest is too old/corrupt
      test: ["CMD", "verify-backup"]
      interval: 1h
      timeout: 30s
      retries: 2
      start_period: 15m
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256
    networks:
      - wished-data

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
  # backup-data is intentionally NOT a named Docker volume — it uses a host path
  # so operator mistakes like `docker compose down -v` cannot destroy backups.

networks:
  wished-app:
    driver: bridge
  wished-data:
    driver: bridge
    internal: true
